name: Проверка и сборка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Прогнать тесты
        run: bash tests/run-tests.sh

      - name: Закоммитить пересобранный setup.sh
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- setup.sh; then
            echo "setup.sh не изменился — коммитить нечего"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup.sh
          git commit -m "build: пересобрать setup.sh из lib/ [skip ci]"
          git push