# Файл ответов для неинтерактивной установки.
#   bash <(curl -fsSL .../setup.sh) /root/node.conf
# Скопируйте, заполните, положите на сервер с правами 600 — внутри секреты.

# --- обязательное ---
DOMAIN="example.com"              # основной домен (зона в Cloudflare)
SUBDOMAIN="node-nl-1"             # имя ноды, без точек
PANEL_IP="203.0.113.10"           # IP мастер-панели, ему откроется порт ноды
REMNA_SECRET=""                   # SECRET_KEY из панели Remnawave
SSH_PUBLIC_KEY="ssh-ed25519 AAAA... you@host"   # без него харденинг SSH отменяется

# --- доступ ---
ADMIN_USER="admin"                # создаваемая учётка с sudo
SSH_PORT="8422"                   # порт SSH после харденинга
ADMIN_PASS=""                     # пусто = сгенерировать случайный

# --- Cloudflare (необязательно) ---
SETUP_CF="n"                      # y — создать/обновить A-запись через API
CF_API_TOKEN=""                   # токен с правом Edit DNS
CF_PROXY_CHOICE="n"               # y — включить оранжевое облако после выпуска сертификата

# --- дополнительные компоненты ---
INSTALL_WARP="n"
INSTALL_SPEEDTEST="n"

# --- Telegram (необязательно) ---
SETUP_TG="n"
TG_BOT_TOKEN=""
TG_CHAT_ID=""                     # супергруппа начинается с -100
TG_TOPIC_ID=""                    # пусто, если без топиков
TG_PROXY=""                       # напр. socks5h://user:pass@host:port
USER_NODE_LABEL=""                # красивое имя ноды в уведомлениях
